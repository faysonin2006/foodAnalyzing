spring.application.name=UserService
server.address=0.0.0.0
server.port=${SERVER_PORT:8092}

userservice.service-token=${USER_SERVICE_TOKEN}
jwt.secret=${JWT_SECRET}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userprofiles}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.cloud.aws.s3.endpoint=${S3_ENDPOINT}
spring.cloud.aws.region.static=${S3_REGION:eu-central-003}
spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
application.bucket.name=${S3_BUCKET_NAME}
application.bucket.public-url=${S3_PUBLIC_URL:}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.rabbitmq.template.exchange=${SPRING_RABBITMQ_TEMPLATE_EXCHANGE:userauth.exchange}
spring.rabbitmq.template.default-receive-queue=${SPRING_RABBITMQ_TEMPLATE_QUEUE:userauth.queue}
spring.rabbitmq.template.routing-key=${SPRING_RABBITMQ_TEMPLATE_ROUTING_KEY:userauth.tracking}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*
