spring.application.name=AuthService

server.address=0.0.0.0

userservice.service-token=${USER_SERVICE_TOKEN}

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
refresh.token.expiration=2592000000

spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=faysonin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8091
#logging.level.org.springframework.security=DEBUG


spring.rabbitmq.port=5672
spring.rabbitmq.host=localhost
spring.rabbitmq.username=guest

spring.rabbitmq.template.exchange=userauth.exchange
spring.rabbitmq.template.default-receive-queue=userauth.queue
spring.rabbitmq.template.routing-key=userauth.tracking


logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

