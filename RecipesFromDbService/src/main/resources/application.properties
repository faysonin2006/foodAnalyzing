spring.application.name=RecipesFromDbService

spring.threads.virtual.enabled=true

jwt.secret=${JWT_SECRET}

userservice.service-token=${USER_SERVICE_TOKEN}

spring.datasource.url=jdbc:postgresql://localhost:5432/recipes
spring.jpa.properties.hibernate.default_schema=cookbook_wh
spring.datasource.username=faysonin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8095

server.compression.enabled=true
server.compression.min-response-size=1024
spring.mvc.async.request-timeout=60000

#logging.level.org.springframework.security=debug
#logging.level.root=debug

logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*