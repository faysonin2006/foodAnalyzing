spring.application.name=RecipeService

spring.threads.virtual.enabled=true

spoonacular.api.key=${SPOONACULAR_API_KEY}

jwt.secret=${JWT_SECRET}

userservice.service-token=${USER_SERVICE_TOKEN}

deepl.auth.key=

spring.datasource.url = jdbc:postgresql://localhost:5432/recipesspoonacular
spring.datasource.username=faysonin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8094

#logging.level.org.springframework.security=debug

logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*